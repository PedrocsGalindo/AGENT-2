[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-explorer-mvp"
version = "0.1.0"
description = "MVP didatico para busca academica com LangGraph e modelo local."
readme = "src/academic_explorer_mvp/README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0",
]

[project.optional-dependencies]
local-model = [
  "accelerate>=0.26.0",
  "torch>=2.0.0",
  "transformers>=4.41.0",
]

[project.scripts]
academic-explorer-mvp = "academic_explorer_mvp.main:main"

[tool.setuptools.packages.find]
where = ["src"]
